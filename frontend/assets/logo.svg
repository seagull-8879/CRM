<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" fill="none" class="themaverics-logo">
  <defs>
    <!-- Left Wing Purple Gradient -->
    <linearGradient id="tmPurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="35%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Right Wave Royal Blue Gradient -->
    <linearGradient id="tmBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Text Purple Gradient -->
    <linearGradient id="tmTextPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Text Blue Gradient -->
    <linearGradient id="tmTextBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Stylized M Emblem Icon -->
  <g transform="translate(140, 6) scale(0.95)">
    <!-- Left Purple Wing / Peak -->
    <path
      d="M 28,68 L 74,4 C 77,1 81,1 84,3 C 94,10 102,23 99,38 C 96,53 82,67 68,76 L 28,68 Z"
      fill="url(#tmPurpleGrad)"
    />

    <!-- Right Royal Blue / Navy Flowing Wave -->
    <path
      d="M 66,38 C 82,24 104,18 126,8 C 138,2 152,0 162,10 C 172,21 168,36 156,48 C 146,59 130,66 116,74 C 98,84 80,90 60,92 C 54,92 50,88 52,82 C 56,70 66,54 74,44 C 82,34 94,26 94,26 L 66,38 Z"
      fill="url(#tmBlueGrad)"
    />

    <!-- Accent Droplet Wave on Upper Right -->
    <path
      d="M 172,22 C 178,25 184,33 182,41 C 180,48 172,50 168,44 C 166,38 166,30 172,22 Z"
      fill="url(#tmBlueGrad)"
    />
  </g>

  <!-- "The" Text in Purple -->
  <text
    x="18"
    y="108"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="-0.5"
    fill="url(#tmTextPurple)"
  >The</text>

  <!-- "Maverics" Text in Tech Royal Blue -->
  <text
    x="108"
    y="108"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="-0.5"
    fill="url(#tmTextBlue)"
  >Maverics</text>

  <!-- Subtitle: TECHNOLOGIES PVT. LTD. -->
  <text
    x="105"
    y="130"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif"
    font-size="12.5"
    font-weight="700"
    letter-spacing="3.8"
    fill="#64748B"
  >TECHNOLOGIES PVT. LTD.</text>
</svg>
